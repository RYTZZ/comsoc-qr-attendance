services:
  - type: web
    name: comsoc-qr-attendance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "ComSoc QR Attendance"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://comsochub.tech
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: comsoc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: comsoc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: comsoc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: comsoc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: comsoc-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: TRUSTED_PROXIES
        value: "*"
      - key: RANKINGS_ENABLED
        value: "false"
      - key: MEMBERSHIP_FEE
        value: "100"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: computingsocietysorsubc@gmail.com
      - key: MAIL_FROM_NAME
        value: "COMSOC HUB"

databases:
  - name: comsoc-db
    plan: free
    databaseName: comsoc_attendance
    user: comsoc_user
