services:
  - type: web
    name: comsoc-qr-attendance
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: "ComSoc QR Attendance"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: comsoc-qr-attendance
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: comsoc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: comsoc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: comsoc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: comsoc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: comsoc-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: RANKINGS_ENABLED
        value: "false"
      - key: MEMBERSHIP_FEE
        value: "100"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

databases:
  - name: comsoc-db
    plan: free
    databaseName: comsoc_attendance
    user: comsoc_user
